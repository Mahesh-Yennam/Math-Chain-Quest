<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="lightningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Circular Base -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)"/>
  
  <!-- Outer Energy Ring -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#67e8f9" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>

  <!-- Lower Number Node "8" -->
  <circle cx="21" cy="41" r="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="21" y="45.5" font-family="'Outfit', sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">8</text>

  <!-- Upper Number Node "16" -->
  <circle cx="43" cy="23" r="12" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="43" y="27.5" font-family="'Outfit', sans-serif" font-weight="900" font-size="11" fill="#fde047" text-anchor="middle">16</text>

  <!-- Connecting Lightning Bolt -->
  <path d="M28 36 L36 28 L32 28 L37 20 L27 30 L31 30 Z" fill="url(#lightningGrad)" stroke="#b45309" stroke-width="0.8"/>

  <!-- Sparkles -->
  <circle cx="16" cy="18" r="2" fill="#ffffff"/>
  <circle cx="50" cy="46" r="1.5" fill="#fde047"/>
</svg>
